[package]
name = "howitt-migrations"
version = "0.1.0"
edition = "2024"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
howitt-postgresql = { path = "../../lib/howitt-postgresql" }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
sha2 = "=0.10.9"
subtle = "=2.6.1"

[target.'cfg(target_arch = "wasm32")'.dependencies]
worker = { version = "=0.8.5", features = ["http", "tokio-postgres"] }

[dev-dependencies]
tokio = { version = "=1.53.1", features = ["macros", "rt"] }
