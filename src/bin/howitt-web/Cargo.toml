[package]
name = "howitt-web"
version = "0.0.0"
edition = "2024"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
axum = { version = "=0.8.9", default-features = false, features = ["json", "query", "macros"] }
axum-macros = "=0.5.1"
tower = { version = "=0.5.3", default-features = false, features = ["util"] }
tower-http = { version = "=0.7.1", default-features = false, features = ["cors"] }
async-graphql-axum = "=7.2.1"
async-graphql = { version = "=7.2.1", default-features = false, features = ["uuid", "chrono", "url", "dataloader", "graphiql"] }
howitt-postgresql = { path = "../../lib/howitt-postgresql" }
howitt-observability = { path = "../../lib/howitt-observability" }
howitt = { path = "../../lib/howitt" }
howitt_client_types = { path = "../../lib/howitt-client-types" }
rwgps_types = { path = "../../lib/rwgps-types" }
anyhow = "=1.0.104"
geo = "=0.33.1"
chrono = "=0.4.45"
chrono-tz = "=0.10.4"
serde = { version = "=1.0.229", features = ["derive"] }
derive_more = { version = "=2.1.1", features = ["full"] }
itertools = "=0.15.0"
thiserror = "=2.0.20"
url = "=2.5.8"
serde_json = "=1.0.151"
async-trait = "=0.1.92"
http = "=1.5.0"
tracing = "=0.1.44"
uuid = "=1.26.1"
futures = "=0.3.34"
tzf-rs = { version = "=0.4.11", default-features = false }
hex = "=0.4.3"
ring = { version = "=0.17.14", features = ["wasm32_unknown_unknown_js"] }
reqwest = { version = "=0.13.5", default-features = false, features = ["json"] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
worker = { version = "=0.8.5", features = ["http", "axum", "tokio-postgres", "queue"] }
tokio-postgres = { version = "=0.7.18", default-features = false, features = ["js"] }
wasm-bindgen-futures = "=0.4.78"
futures-timer = { version = "=3.0.4", features = ["wasm-bindgen"] }
getrandom = { version = "=0.4.3", features = ["wasm_js"] }

[dev-dependencies]
tracing-subscriber = { version = "=0.3.23", default-features = false, features = ["registry"] }
test-case = "=3.3.1"
tokio = { version = "=1.53.1", features = ["rt", "macros"] }
