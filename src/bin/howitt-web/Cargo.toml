[package]
name = "howitt-web"
version = "0.0.0"
edition = "2021"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
axum = { version = "0.8", default-features = false, features = ["json", "query", "macros"] }
axum-macros = "0.5"
tower = { version = "0.5", default-features = false, features = ["util"] }
tower-http = { version = "0.6", default-features = false, features = ["cors"] }
async-graphql-axum = { git = "https://github.com/async-graphql/async-graphql.git" }
async-graphql = { git = "https://github.com/async-graphql/async-graphql.git", default-features = false, features = ["uuid", "chrono", "url", "dataloader", "graphiql"] }
howitt-postgresql = { path = "../../lib/howitt-postgresql" }
howitt = { path = "../../lib/howitt" }
howitt_client_types = { path = "../../lib/howitt-client-types" }
rwgps_types = { path = "../../lib/rwgps-types" }
anyhow = "1"
geo = "*"
chrono = "*"
chrono-tz = "*"
serde = { version = "1", features = ["derive"] }
derive_more = { version = "1", features = ["full"] }
itertools = "*"
thiserror = "*"
url = "*"
serde_json = "1"
async-trait = "0.1"
http = "1"
tracing = "0.1"
uuid = "1"
futures = "0.3"
tzf-rs = { version = "=0.4.11", default-features = false }

[target.'cfg(target_arch = "wasm32")'.dependencies]
worker = { version = "=0.8.5", features = ["http", "axum", "tokio-postgres"] }
tokio-postgres = { version = "0.7.18", default-features = false, features = ["js"] }
wasm-bindgen-futures = "0.4"
futures-timer = { version = "3", features = ["wasm-bindgen"] }
getrandom = { version = "0.2", features = ["js"] }
ring = { version = "0.17", features = ["wasm32_unknown_unknown_js"] }

[dev-dependencies]
test-case = "3.1.0"
tokio = { version = "1", features = ["rt", "macros"] }
