name = "howitt-web"
main = "src/bin/howitt-web/build/worker/shim.mjs"
compatibility_date = "2026-09-12"
compatibility_flags = ["nodejs_als"]
workers_dev = true

routes = [
  { pattern = "api.howittplains.net", custom_domain = true }
]

[placement]
region = "aws:us-west-2"

[observability]
enabled = true

[observability.traces]
enabled = true

[vars]
RWGPS_REDIRECT_URI = "https://api.howittplains.net/auth/rwgps/callback"
# Enable only after Images provisioning and delivery checks; see docs/cloudflare-images.md.
IMAGES_UPLOADS_ENABLED = "true"
IMAGES_ACCOUNT_ID = "e2edbea059cd231b81084fe93feb3c6a"
IMAGES_DELIVERY_HASH = "Ff51WMNEsryRxxLlG-yVXA"
# IMAGES_API_TOKEN is a Worker secret, never a var or committed credential.

[build]
command = "bash scripts/build-worker.sh"

[[hyperdrive]]
binding = "HYPERDRIVE"
id = "324c2bb0ba3d4ac9b1fce0618ccbae4d"

# Disposable, versioned derived data only; not sessions or authoritative records.
[[kv_namespaces]]
binding = "DERIVED_CACHE"
id = "5de58615f5114086b708a9387f518552"

[[queues.producers]]
binding = "JOBS"
queue = "howitt-jobs"

# Public upstream timezone polygons are assets, not part of the Wasm upload.
[assets]
directory = "src/bin/howitt-web/build/assets"
binding = "ASSETS"
