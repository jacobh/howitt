name = "howitt-worker"
main = "src/bin/howitt-worker/build/worker/shim.mjs"
compatibility_date = "2026-09-12"
compatibility_flags = ["nodejs_als"]
workers_dev = false
preview_urls = false

[observability]
enabled = true

[build]
command = "bash scripts/build-worker.sh howitt-worker"

[limits]
cpu_ms = 300000

[[hyperdrive]]
binding = "HYPERDRIVE"
id = "324c2bb0ba3d4ac9b1fce0618ccbae4d"

[[queues.producers]]
binding = "JOBS"
queue = "howitt-jobs"

[[queues.consumers]]
queue = "howitt-jobs"
max_batch_size = 1
max_batch_timeout = 1
max_concurrency = 2
max_retries = 5
retry_delay = 60
dead_letter_queue = "howitt-jobs-dead"
